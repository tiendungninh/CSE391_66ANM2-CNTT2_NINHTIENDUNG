<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Form đặt hàng</title>

<style>

body{
    font-family: Arial;
    padding:20px;
}

label{
    display:block;
    margin-top:10px;
}

input[type="text"],
input[type="number"],
input[type="date"],
textarea,
select{
width:250px;
padding:5px;
}

input[type="radio"]{
width:auto;
margin-right:5px;
}

.error{
    color:red;
    font-size:13px;
}

#noteCount{
    font-size:12px;
}

#summary{
    border:1px solid #ccc;
    padding:10px;
    margin-top:20px;
    width:300px;
    display:none;
}

</style>

</head>
<body>

<h2>Form đặt hàng</h2>

<form id="orderForm">

<label>Tên sản phẩm</label>
<select id="product">
<option value="">-- Chọn sản phẩm --</option>
<option value="Áo">Áo</option>
<option value="Quần">Quần</option>
<option value="Giày">Giày</option>
</select>
<div class="error" id="productError"></div>

<label>Số lượng</label>
<input type="number" id="quantity">
<div class="error" id="quantityError"></div>

<label>Ngày giao hàng</label>
<input type="date" id="deliveryDate">
<div class="error" id="dateError"></div>

<label>Địa chỉ giao</label>
<input type="text" id="address">
<div class="error" id="addressError"></div>

<label>Ghi chú</label>
<textarea id="note" maxlength="200"></textarea>
<div id="noteCount">0/200</div>
<div class="error" id="noteError"></div>

<label>Phương thức thanh toán</label>

<input type="radio" name="payment" value="COD"> COD
<input type="radio" name="payment" value="Chuyển khoản"> Chuyển khoản
<input type="radio" name="payment" value="Ví điện tử"> Ví điện tử

<div class="error" id="paymentError"></div>

<br><br>

<div>Tổng tiền: <b id="total">0</b> VND</div>

<br>

<button type="submit">Đặt hàng</button>

</form>

<div id="summary"></div>

<script>

const prices={
"Áo":150000,
"Quần":200000,
"Giày":500000
}

const product=document.getElementById("product")
const quantity=document.getElementById("quantity")
const total=document.getElementById("total")

function updateTotal(){

let p=product.value
let q=Number(quantity.value)

if(prices[p] && q>0){
let t=prices[p]*q
total.innerText=t.toLocaleString("vi-VN")
}else{
total.innerText="0"
}

}

product.addEventListener("change",updateTotal)
quantity.addEventListener("input",updateTotal)


const note=document.getElementById("note")
const noteCount=document.getElementById("noteCount")

note.addEventListener("input",function(){

let len=note.value.length

noteCount.innerText=len+"/200"

if(len>200){
noteCount.style.color="red"
}else{
noteCount.style.color="black"
}

})


function showError(id,msg){
document.getElementById(id).innerText=msg
}

function clearErrors(){
document.querySelectorAll(".error").forEach(e=>e.innerText="")
}

document.getElementById("orderForm").addEventListener("submit",function(e){

e.preventDefault()

clearErrors()

let valid=true

let p=product.value
let q=Number(quantity.value)
let date=document.getElementById("deliveryDate").value
let address=document.getElementById("address").value
let pay=document.querySelector("input[name='payment']:checked")

if(p===""){
showError("productError","Chọn sản phẩm")
valid=false
}

if(!Number.isInteger(q) || q<1 || q>99){
showError("quantityError","Số lượng 1-99")
valid=false
}

let today=new Date()
let d=new Date(date)

let max=new Date()
max.setDate(today.getDate()+30)

if(!date || d<today || d>max){
showError("dateError","Ngày giao phải trong 30 ngày tới")
valid=false
}

if(address.trim().length<10){
showError("addressError","Địa chỉ ≥10 ký tự")
valid=false
}

if(!pay){
showError("paymentError","Chọn phương thức thanh toán")
valid=false
}

if(!valid) return

let sum=prices[p]*q

let summary=document.getElementById("summary")

summary.style.display="block"

summary.innerHTML=`
<h3>Xác nhận đặt hàng</h3>
Sản phẩm: ${p} <br>
Số lượng: ${q} <br>
Tổng tiền: ${sum.toLocaleString("vi-VN")} VND <br>
Ngày giao: ${date} <br><br>

<button onclick="confirmOrder()">Xác nhận</button>
<button onclick="cancelOrder()">Hủy</button>
`

})

function confirmOrder(){

document.getElementById("summary").innerHTML=
"<h3>Đặt hàng thành công 🎉</h3>"

}

function cancelOrder(){

document.getElementById("summary").style.display="none"

}

</script>

</body>
</html>
